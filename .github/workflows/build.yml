# grog CI — build + test + package.
#
# Two jobs:
#   test  — the fast gate: offline unit tests, a compile check of the spine,
#           the MCP wire test, and a renderer compile. Runs on every push and PR.
#   dist  — the slow one: builds BOTH jars + the renderer, then the Windows NSIS
#           installer and the Linux AppImage, and (on a v* tag) attaches them to
#           a GitHub Release. Runs on branch pushes, tags, and manual dispatch —
#           NOT on pull requests (a public repo would otherwise let anyone burn
#           ~15 min of packaging per PR).
#
# Why Wine: `bb dist --target windows` on Linux needs Wine, and NOT for signing.
# electron-builder builds NSIS in two passes — `makensis` emits an intermediate
# installer, then it RUNS that installer under Wine to capture the uninstaller it
# writes at runtime; Wine is also used for rcedit (grog icon + version stamping).
# See the comment in scripts/build_dist.clj. The NSIS installer is 32-bit, so the
# runner needs a 32-bit-capable Wine (i386 + wine32) and a display (Xvfb).
#
# This repo is PUBLIC, so standard GitHub-hosted runners and Actions storage are
# free — no secrets are required to build or to run any of these checks. Smoke
# tests (scripts/electron-smoke.js, scripts/smoke-server.js) are deliberately
# NOT wired in here.

name: build

on:
  push:
    branches: [master, v2, winloop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref; supersede in-flight runs EXCEPT on tags — never cancel a
# release build that is mid-package.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: unit + compile gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -L -o /tmp/linux-install.sh \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x /tmp/linux-install.sh
          sudo /tmp/linux-install.sh

      - name: Install babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Cache Clojure deps (Maven + gitlibs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: clj-${{ runner.os }}-

      - name: Offline JS tests
        run: |
          node scripts/log-test.js
          node scripts/config-seed-test.js
          node scripts/desktop-install-test.js
          bb clients/web/scripts/md-test.clj

      - name: Provider catalogue test
        run: bb scripts/providers-test.clj

      # What a MODEL PICK actually writes. The panel sends a PLACE (`local` /
      # `remote`) or a recents row's own `[url model]`, and the server turns that
      # into `:llm :url` + `:llm :model`. Two reports came out of not testing it:
      # a recents click that set the model but not the transport, and a transport
      # pick that wrote a placeholder id ("local-model") no server answers to.
      # Needs a throwaway config home (it writes grog.edn), hence the wrapper.
      - name: Model picker test (what a pick writes)
        run: ./scripts/model-picker-test.sh

      - name: Model recents test (LRU order, cap, /model)
        run: ./scripts/recents-test.sh

      - name: Agent loop offline tests (stop conditions + repetition guard + stalls)
        run: |
          clojure -M scripts/stop-condition-test.clj
          clojure -M scripts/tool-search-test.clj
          clojure -M scripts/stall-test.clj
          clojure -M scripts/edit-file-verify-test.clj

      # A shell call's timeout must END the call. `run-capture` used to read the
      # child's stdout through a pipe in a future and deref it unbounded, so a
      # command that backgrounded a grandchild (start-a-server-and-probe-it, the
      # ordinary shape) left the pipe open and hung the turn FOREVER — after the
      # timeout had already "fired". The test measures the wall clock, so a
      # regression fails rather than hanging the suite.
      - name: Shell tool timeout is real (no hang on a backgrounded child)
        run: clojure -M scripts/shell-hang-test.clj

      # One log file per client run holds EVERY tab's spine output, so per-session
      # lines must carry `[<session-id>]` or the log pane's "this project" scope
      # silently filters nothing. That tag's emitter (`grog.eca/connect!`) was
      # deleted with ECA and the filter has been dead since; this pins it.
      - name: Session tagging (the log pane's per-tab filter)
        run: clojure -M scripts/session-tag-test.clj

      # The context budget must fit the ENDPOINT's window, not a 200k constant.
      # A 200k budget against a 32k local server is a hard 400 with no answer
      # (the reported failure), so the probe + clamp get their own gate — and the
      # cache is pinned to (url, MODEL), because a url can serve a whole catalogue.
      - name: Context window clamp (endpoint probe, per-model cache, no model)
        run: clojure -M scripts/context-window-test.clj

      # AN OVERFLOW MUST NOT DESTROY THE THREAD. If the prompt does not fit, the
      # loop distills, remembers the ceiling the provider named, and re-sends the
      # same step; only a provider that refuses everything surfaces an error, and
      # it says what happened. The fixture refuses exactly as llama.cpp does, so
      # the recovery path is exercised without a model or a network.
      - name: Context overflow recovery (distill + re-send, no model)
        run: clojure -M scripts/context-overflow-test.clj

      # The recents/LRU list: order is the feature, so the test re-picks an
      # existing entry and asserts it moved to the FRONT (a FIFO list passes
      # every other check). Run through the wrapper — it supplies the throwaway
      # GROG_CONFIG_HOME the test refuses to run without.
      - name: Model recents (LRU) test
        run: sh scripts/recents-test.sh

      # The mock engine runs no model and costs nothing: every eval case carries an
      # honest AND a cheat trajectory, and the PAIR is the gate. If the cheat run
      # ever passes, a check has stopped discriminating and the case is decoration.
      - name: Eval checks discriminate (mock engine, no model)
        run: |
          clojure -M scripts/eval.clj --engine mock --strict
          ! clojure -M scripts/eval.clj --engine mock --variant cheat --strict

      - name: Spine compiles
        run: clojure -J--add-opens=java.base/java.lang=ALL-UNNAMED -M -e "(require 'grog.server 'grog.config 'grog.models 'grog.chat 'grog.client.loop 'grog.client.remote 'grog.eca-config 'grog.doctor) (println :SPINE-OK)"

      - name: Build the MCP bundle jar
        working-directory: grog_mcp
        run: clojure -T:build uber

      - name: MCP wire test (inputSchema must be a JSON object)
        working-directory: grog_mcp
        run: clojure -M:test

      - name: Renderer compiles and its event tests pass
        working-directory: clients/web
        env:
          # the compile check needs shadow-cljs, not the Electron binary
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npx shadow-cljs compile app
          # the renderer's EVENT logic (no browser, no Electron, no spine) — the
          # onboarding-page vs. slash-command-output regression. Runs HERE, not in
          # "Offline JS tests", because it needs node_modules (npm ci is above).
          npm run test:renderer

  dist:
    name: installers
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: write   # required to attach installers to a Release on tags
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -L -o /tmp/linux-install.sh \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x /tmp/linux-install.sh
          sudo /tmp/linux-install.sh

      - name: Install babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Wine (32-bit) + Xvfb + FUSE
        # NSIS installers are 32-BIT. The runner's stock `wine` is 64-bit-only, so
        # electron-builder's "run the installer under Wine to capture the
        # uninstaller" pass dies with:
        #   wine: failed to load C:\windows\syswow64\ntdll.dll (c0000135)
        # Adding the i386 architecture + wine32 gives Wine a working 32-bit
        # subsystem. Xvfb supplies the $DISPLAY Wine's windowed bits want on a
        # headless box (the "nodrv_CreateWindow / no driver" errors).
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 wine64 xvfb xauth
          # libfuse2 is needed for the AppImage step; on 24.04 it is libfuse2t64
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Cache Clojure + electron-builder caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.cache/electron
            ~/.cache/electron-builder
          key: dist-${{ runner.os }}-${{ hashFiles('**/deps.edn', 'clients/web/package-lock.json') }}
          restore-keys: dist-${{ runner.os }}-

      - name: Web deps (incl. the Electron binary)
        working-directory: clients/web
        run: npm ci

      - name: Build both jars + renderer + Windows NSIS + Linux AppImage
        # xvfb-run gives Wine a display for the NSIS uninstaller pass.
        # Installers ship NO speech model: voice input needs whisper.cpp's
        # engine (from the user's package manager) plus a ggml model the user
        # supplies — see models/README.md for where the client looks.
        run: xvfb-run -a bb dist --target all

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: grog-installers
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.AppImage

      - name: Attach installers to the Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.AppImage
