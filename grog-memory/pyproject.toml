[project]
name = "grog-memory"
version = "0.1.0"
description = "MCP server exposing grog's persistent memory/associative-store tools (Python, sqlite3)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["grog_memory"]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
